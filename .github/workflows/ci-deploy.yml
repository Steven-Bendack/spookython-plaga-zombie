# Tests on every push and pull request; production deploy to Vercel only
# when main is green. Deploys go through scripts/deploy_vercel.sh (a clean
# copy outside git), so commits from any teammate deploy without being blocked.
name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy pytest boto3
      - run: python -m pytest -q
      - name: JavaScript syntax
        run: for f in src/web/*.js; do node --check "$f"; done

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://plaga-zombie-manta.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_evqxBtCdGBPYMMgzaPuEw0BI
      VERCEL_PROJECT_ID: prj_OpClbtsVly5uvdI5sIiULgAWBLNJ
    steps:
      - name: Token present
        id: token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret is missing; skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.token.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.token.outputs.ok == 'true'
        run: bash scripts/deploy_vercel.sh
      - name: Production serves this commit
        if: steps.token.outputs.ok == 'true'
        run: |
          sleep 5
          curl -fsS https://plaga-zombie-manta.vercel.app/ -o /dev/null
          live=$(curl -fsS -X POST https://plaga-zombie-manta.vercel.app/api/simulate \
            -H 'content-type: application/json' -d '{"seed":2026,"runs":2}' \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['certificate']['commit'])")
          echo "live commit: $live"
          test "$live" = "${GITHUB_SHA::12}"

  # AWS (the official deployment): same tests gate it. The deploy user can only
  # update this stack, its two buckets and its CloudFront (least privilege);
  # CloudFormation itself runs with the plaga-zombie-cfn-deploy role.
  deploy-aws:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: aws
      url: https://darwqtaqrduba.cloudfront.net
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      # The mayor's report: passed as a NoEcho parameter; without it the API answers with the template.
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      STACK: plaga-zombie
      CFN_ROLE: arn:aws:iam::509306734195:role/plaga-zombie-cfn-deploy
      ARTIFACTS: aws-sam-cli-managed-default-samclisourcebucket-ol2nsrrrv51t
      WEB_BUCKET: plaga-zombie-webbucket-h262ibaw54zz
      DISTRIBUTION: EPB5V1I9V97MN
      URL: https://darwqtaqrduba.cloudfront.net
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Build (numpy layer for Lambda + SAM)
        run: |
          python infra/build_layer.py
          echo "${GITHUB_SHA::12}" > src/engine/COMMIT
          sam build -t infra/template.yaml --build-dir build/sam
      - name: Deploy the stack
        run: |
          sam deploy --template-file build/sam/template.yaml --stack-name "$STACK" \
            --s3-bucket "$ARTIFACTS" --role-arn "$CFN_ROLE" --capabilities CAPABILITY_IAM \
            --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides MaxFanout=8 MapMaxConcurrency=8 DeepSeekApiKey="$DEEPSEEK_API_KEY"
      - name: Upload the web
        run: |
          aws s3 sync src/web "s3://$WEB_BUCKET" --delete --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*" >/dev/null
      - name: AWS serves this commit (and the mayor's report comes from the AI)
        run: |
          source=$(curl -fsS -X POST "$URL/api/report" -H 'content-type: application/json'             -d '{"strategy":"ring_hubs","r0":2,"doses_per_day":20,"vaccine_efficacy":0.9,"seed_location":"random","runs":100,"manta_scale":27.1,"saved_none":3922,"saved_none_p5":889,"saved_none_p95":6510,"saved_random":2697,"win_rate":0.95,"wasted_share":0.32}'             | python3 -c "import json,sys; print(json.load(sys.stdin)['source'])")
          echo "mayor report source: $source"
          if [ -n "$DEEPSEEK_API_KEY" ]; then test "$source" = "ai"; fi
          live=$(curl -fsS -X POST "$URL/api/simulate" -H 'content-type: application/json' \
            -d '{"seed":2026,"runs":2}' | python3 -c "import json,sys; print(json.load(sys.stdin)['certificate']['commit'])")
          echo "live commit: $live"
          test "$live" = "${GITHUB_SHA::12}"
