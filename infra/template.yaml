AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Plaga Zombie (SpookyThon 2026, Track B). Static web on S3 + CloudFront,
  HTTP API -> Lambda (interactive tournament with worker fan-out) and
  Step Functions Distributed Map for big Monte Carlo jobs. Region: us-east-1.

Parameters:
  MaxFanout:
    Type: Number
    Default: 10
    Description: Parallel worker Lambdas per interactive request (keep under the account concurrency quota).
  MapMaxConcurrency:
    Type: Number
    Default: 40
    Description: Parallel children of the Distributed Map.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email for the alarms (AWS sends a confirmation link first).
  DeepSeekApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional key for the mayor's report. Empty = template text, no AI.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    CodeUri: ../src/
    Layers: [!Ref NumpyLayer]
    Tracing: Active
    Environment:
      Variables:
        RESULTS_BUCKET: !Ref ResultsBucket

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  # ---------- shared code ----------
  NumpyLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: numpy (manylinux wheel) built by infra/build_layer.py
      ContentUri: ../build/numpy-layer/
      CompatibleRuntimes: [python3.12]

  # ---------- storage ----------
  ResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-jobs
            Status: Enabled
            ExpirationInDays: 30

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ---------- API ----------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.api.handler
      MemorySize: 1769
      Timeout: 29
      Environment:
        Variables:
          WORKER_FUNCTION: !Ref WorkerFunction
          STATE_MACHINE_ARN: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-montecarlo"
          MAX_FANOUT: !Ref MaxFanout
          MAX_INTERACTIVE_RUNS: "200"
          DEEPSEEK_API_KEY: !Ref DeepSeekApiKey
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref WorkerFunction }
        - S3ReadPolicy: { BucketName: !Ref ResultsBucket }
        - Statement:
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-montecarlo"
            - Effect: Allow
              Action: states:DescribeExecution
              Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${AWS::StackName}-montecarlo:*"
      Events:
        Meta:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/meta }
        Simulate:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /api/simulate }
        Challenge:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /api/challenge }
        Report:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /api/report }
        StartJob:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /api/jobs }
        JobStatus:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/api/jobs/{id}" }

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.worker.handler
      MemorySize: 3008
      Timeout: 120

  # ---------- big Monte Carlo jobs ----------
  JobPlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.jobs.plan
      MemorySize: 3008   # it calibrates every attacked outbreak: CPU scales with memory
      Timeout: 300
      Policies:
        - S3CrudPolicy: { BucketName: !Ref ResultsBucket }

  JobAggregateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.jobs.aggregate
      MemorySize: 3008
      Timeout: 300
      Policies:
        - S3CrudPolicy: { BucketName: !Ref ResultsBucket }

  MonteCarloStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-montecarlo"
      DefinitionUri: statemachine/montecarlo.asl.json
      DefinitionSubstitutions:
        PlanFunctionArn: !GetAtt JobPlanFunction.Arn
        WorkerFunctionArn: !GetAtt WorkerFunction.Arn
        AggregateFunctionArn: !GetAtt JobAggregateFunction.Arn
        ResultsBucket: !Ref ResultsBucket
        MaxConcurrency: !Ref MapMaxConcurrency
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref JobPlanFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref WorkerFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref JobAggregateFunction }
        - S3CrudPolicy: { BucketName: !Ref ResultsBucket }
        - Statement:
            # The Distributed Map starts child executions of this same state machine.
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-montecarlo"
            - Effect: Allow
              Action: [states:DescribeExecution, states:StopExecution]
              Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${AWS::StackName}-montecarlo/*"

  # ---------- CDN: one public URL for web and API ----------
  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Plaga Zombie Manta
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOriginAccessControl
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginReadTimeout: 30
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6        # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad      # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader

  # ---------- monitoring: one dashboard and alarms that page the team ----------
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Plaga Zombie alarms

  AlertsEmail:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # Any error in the public API (a simulation the jury runs live) is worth knowing at once.
  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The public API (Recomendar, duel, report) returned errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # New accounts have a concurrency of 10: throttled workers mean slower answers.
  WorkerThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Simulation workers were throttled (account concurrency limit)
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{ Name: FunctionName, Value: !Ref WorkerFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # A failed Jury Mode / decision map job (Step Functions Distributed Map).
  JobsFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A big Monte Carlo job (Step Functions) failed
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions: [{ Name: StateMachineArn, Value: !Ref MonteCarloStateMachine }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}"
      DashboardBody: !Sub |
        {"widgets": [
          {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6, "properties": {
            "title": "Invocaciones por función", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
            "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "${ApiFunction}", {"label": "API"}],
                        ["...", "${WorkerFunction}", {"label": "Trabajadores"}],
                        ["...", "${JobPlanFunction}", {"label": "Planificador"}],
                        ["...", "${JobAggregateFunction}", {"label": "Agregador"}]]}},
          {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6, "properties": {
            "title": "Errores y throttles", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
            "metrics": [["AWS/Lambda", "Errors", "FunctionName", "${ApiFunction}", {"label": "Errores API"}],
                        ["...", "${WorkerFunction}", {"label": "Errores trabajadores"}],
                        ["AWS/Lambda", "Throttles", "FunctionName", "${WorkerFunction}", {"label": "Throttles trabajadores"}]]}},
          {"type": "metric", "x": 0, "y": 6, "width": 12, "height": 6, "properties": {
            "title": "Duración p95 (ms)", "region": "${AWS::Region}", "stat": "p95", "period": 300, "view": "timeSeries",
            "metrics": [["AWS/Lambda", "Duration", "FunctionName", "${ApiFunction}", {"label": "API"}],
                        ["...", "${WorkerFunction}", {"label": "Trabajadores"}]]}},
          {"type": "metric", "x": 12, "y": 6, "width": 12, "height": 6, "properties": {
            "title": "Trabajos de Step Functions (Modo Jurado)", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
            "metrics": [["AWS/States", "ExecutionsStarted", "StateMachineArn", "${MonteCarloStateMachine}", {"label": "Iniciados"}],
                        [".", "ExecutionsSucceeded", ".", ".", {"label": "Exitosos"}],
                        [".", "ExecutionsFailed", ".", ".", {"label": "Fallidos"}]]}},
          {"type": "alarm", "x": 0, "y": 12, "width": 24, "height": 3, "properties": {
            "title": "Alarmas", "alarms": ["${ApiErrorsAlarm.Arn}", "${WorkerThrottlesAlarm.Arn}", "${JobsFailedAlarm.Arn}"]}}
        ]}

Outputs:
  WebUrl:
    Description: Public URL (web + /api)
    Value: !Sub "https://${Distribution.DomainName}"
  WebBucketName:
    Description: Upload src/web here (aws s3 sync)
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref Distribution
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  DashboardUrl:
    Description: CloudWatch dashboard of the deployment
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${AWS::StackName}"
